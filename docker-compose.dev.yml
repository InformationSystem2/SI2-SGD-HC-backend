name: sgd-hc-dev
services:
  # PostgreSQL Database
  postgres:
    image: postgres:18-alpine
    container_name: sgd-hc-postgres
    env_file:
      - ./SI2-SGD-HC-backend/.env
    environment:
      POSTGRES_DB: ${DB_NAME:-sgd_hc}
      POSTGRES_USER: ${DB_USERNAME:-superuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-superuser}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5433:5432"
    networks:
      - sgd-hc-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-superuser} -d ${DB_NAME:-sgd_hc}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend Service
  backend:
    image: sgd-hc-backend:dev
    build:
      context: ./SI2-SGD-HC-backend
      dockerfile: Dockerfile.dev
    container_name: sgd-hc-backend
    env_file:
      - ./SI2-SGD-HC-backend/.env
    environment:
      # Use internal postgres container
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-sgd_hc}
      DB_NAME: ${DB_NAME:-sgd_hc}
      DB_USERNAME: ${DB_USERNAME:-superuser}
      DB_PASSWORD: ${DB_PASSWORD:-superuser}
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8081:8080"
    volumes:
      - ./SI2-SGD-HC-backend:/app
      - /app/build
      - gradle_cache:/root/.gradle
    networks:
      - sgd-hc-net
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Frontend Service 
  frontend:
    image: sgd-hc-frontend:dev
    build:
      context: ./SI2-SGD-HC-frontend
      dockerfile: Dockerfile.dev
    container_name: sgd-hc-frontend
    ports:
      - "4200:4200"
    volumes:
      - ./SI2-SGD-HC-frontend:/app
      - /app/node_modules
    networks:
      - sgd-hc-net
    depends_on:
      - backend
    environment:
      # Point to backend on the host, since frontend runs in browser
      API_URL: ${API_URL:-http://localhost:8081/api}
    command: npm run start:docker -- --host 0.0.0.0 --poll 2000
    restart: unless-stopped

  # Backup Service — Ejecuta pg_dump completo y por tenant cada noche (02:00 AM)
  backup:
    image: postgres:18-alpine
    container_name: sgd-hc-backup
    env_file:
      - ./SI2-SGD-HC-backend/.env
    environment:
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-sgd_hc}
      DB_USERNAME: ${DB_USERNAME:-superuser}
      DB_PASSWORD: ${DB_PASSWORD:-superuser}
      RUNNING_IN_DOCKER: "true"
      AZURE_STORAGE_SAS_URL: "https://sgdsi2.blob.core.windows.net/database-backups?sv=2026-02-06&ss=b&srt=co&sp=rwctfx&se=2026-10-02T04:15:06Z&st=2026-06-01T20:00:06Z&spr=https&sig=nJhvM8L%2FfRIyn6y01R8d%2FJAKif00oGaBfSbN1mGufWs%3D"
    volumes:
      - ./SI2-SGD-HC-backend/scripts/backup:/scripts/backup:ro
      - ./SI2-SGD-HC-backend/backups:/backups
    networks:
      - sgd-hc-net
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        mkdir -p /var/spool/cron/crontabs /backups/logs &&
        echo '0 2 * * * /bin/bash /scripts/backup/backup.sh >> /backups/logs/cron.log 2>&1' > /var/spool/cron/crontabs/root &&
        chmod 600 /var/spool/cron/crontabs/root &&
        echo 'Servicio backup iniciado. Próxima ejecución: 02:00 AM diaria.' &&
        crond -f -l 8
      "
    restart: unless-stopped

networks:
  sgd-hc-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  gradle_cache:
    driver: local
